services:
  broker-1:
    build: .
    container_name: broker-1
    environment:
      BROKER_ID: "1"
      LEADER_BROKER_ID: "1"
      ALL_BROKER_IDS: "1,2,3,4,5"
      METADATA_DIR: "/metadata"
      DATA_DIR: "/data"
      BROKERS: "1@broker-1:80,2@broker-2:80,3@broker-3:80,4@broker-4:80,5@broker-5:80"
    ports:
      - "8001:80"
    volumes:
      - ./metadata/broker-1:/metadata
      - ./data/broker-1:/data

